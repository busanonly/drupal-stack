# =====================================================================
#  nginx untuk Drupal 11 — drupal/web
#  Dipasang ke /etc/nginx/conf.d/default.conf
#  Docroot = /var/www/html/web (root proyek Drupal di-mount ke /var/www/html)
#  PHP-FPM  = service `drupal` (container drupal_php) port 9000
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/web;
    index index.php index.html;

    client_max_body_size 128M;

    # --- file dasar (jangan penuhi log) ---
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # --- keamanan: tolak file tersembunyi (.env, .git, dsb) & file internal ---
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/core/.*\.(txt|md|conf)$ {
        deny all;
    }

    location ~ ^/sites/[^/]+/files/private/ {
        deny all;
    }

    # --- routing utama Drupal ---
    location / {
        try_files $uri /index.php?$query_string;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1;
    }

    # --- image style/generate file di sites/*/files ---
    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    # --- PHP-FPM ---
    location ~ \.php$|^/update.php {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass drupal:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # --- cache statis ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires max;
        log_not_found off;
        try_files $uri @rewrite;
    }
}
